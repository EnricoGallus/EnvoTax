inherit_from: .rubocop_todo.yml

AllCops:
  NewCops: enable
  Exclude:
    - "bin/**"
    - "db/schema.rb"
    - "db/*schema.rb"
    - "node_modules/**/*"
    - "tmp/**"
    - "vendor/**"

plugins:
  - rubocop-rails
  - rubocop-rspec
  - rubocop-performance
  - rubocop-thread_safety
  - rubocop-md

require:
  - rubocop-i18n
  - rubocop-factory_bot
  - rubocop-capybara
  - rubocop-rspec_rails

Layout/LineLength:
  Max: 120

Style/StringLiterals:
  EnforcedStyle: double_quotes

Metrics/MethodLength:
  Max: 15